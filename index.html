.album-cover{position:absolute;top:0;left:0;width:100%;height:100%;aspect-ratio:1/1;border-radius:16px;overflow:hidden;box-shadow:0 12px 35px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);z-index:2;background:#1e1e22}

.black-player-bar{width:100%;height:65px;background:rgba(17,17,19,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:35px;display:flex;align-items:center;padding:0 16px 0 10px;border:1px solid rgba(255,255,255,.15);box-shadow:0 8px 25px rgba(0,0,0,.5)}
.station-avatar{width:45px;height:45px;background:#fff;border-radius:50%;margin-right:12px;overflow:hidden;flex-shrink:0}
.station-avatar img{width:100%;height:100%;object-fit:cover}
.track-text{flex:1;overflow:hidden}

.btn-action-play:active{transform:scale(.92)}
.btn-action-secondary{width:50px;height:50px;background:rgba(17,17,19,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:50%;color:#fff;display:flex;justify-content:center;align-items:center;font-size:18px;border:1px solid rgba(255,255,255,.15);cursor:pointer}

@keyframes spinVinyl{from{transform:translateX(110px) rotate(0deg)}to{transform:translateX(110px) rotate(360deg)}}

<div class="app-container" id="mainContainer">

<script>
const STREAM_URL = "https://radios.voiparkas.com/listen/fusionstereo/radio.mp3";
const INSTAGRAM_URL = "https://www.instagram.com/emisorafusionstereo?igsi=<script>
const STREAM_URL = "https://radios.voiparkas.com/listen/fusionstereo/radio.mp3";
const INSTAGRAM_URL = "https://www.instagram.com/emisorafusionstereo?igsi=MWFjaGtjM2czeWNrZg==";
const WHATSAPP_URL = "https://wa.me/573117679576";

const audio = new Audio();
audio.preload = "none";
audio.autoplay = false;
audio.playsInline = true;

const playBtn = document.getElementById("playBtn");
const playIcon = document.getElementById("playIcon");
const mainContainer = document.getElementById("mainContainer");
const waveContainer = document.getElementById("wave-container");
const pwaBtn = document.getElementById("pwaBtn");
const instagramBtn = document.getElementById("instagramBtn");
const whatsappBtn = document.getElementById("whatsappBtn");

const BARS_COUNT = 32;
const barElements = [];

for(let i=0;i<BARS_COUNT;i++){
    const bar=document.createElement("div");
    bar.className="wave-bar";
    waveContainer.appendChild(bar);
    barElements.push(bar);
}

let playing=false;
let reconnectTimer=null;
let lastTime=-1;
let stalledChecks=0;

function streamSource(){
    return STREAM_URL + (STREAM_URL.includes("?") ? "&" : "?") + "t=" + Date.now();
}

function setPlayingState(value){
    playing=value;
    playIcon.className=value ? "fa-solid fa-pause" : "fa-solid fa-play";
    mainContainer.classList.toggle("playing",value);
}

async function connectStream(){
    clearTimeout(reconnectTimer);
    try{
        initAudioAnalyser();
        if(audioContext && audioContext.state==="suspended"){
            await audioContext.resume();
        }
        audio.pause();
        audio.src=streamSource();
        audio.load();
        await audio.play();
        setPlayingState(true);
        stalledChecks=0;
    }catch(error){
        console.error("Error reproduciendo Fusión Stereo:",error);
        setPlayingState(false);
    }
}

function scheduleReconnect(){
    if(!playing) return;
    clearTimeout(reconnectTimer);
    reconnectTimer=setTimeout(async()=>{
        if(!playing) return;
        try{
            initAudioAnalyser();
            if(audioContext && audioContext.state==="suspended"){
                await audioContext.resume();
            }
            audio.pause();
            audio.src=streamSource();
            audio.load();
            await audio.play();
            stalledChecks=0;
            setPlayingState(true);
        }catch(error){
            stalledChecks++;
            scheduleReconnect();
        }
    },Math.min(12000,1500+(stalledChecks*1200)));
}

playBtn.addEventListener("click",async()=>{
    if(!playing){
        await connectStream();
    }else{
        clearTimeout(reconnectTimer);
        audio.pause();
        setPlayingState(false);
    }
});

audio.addEventListener("playing",()=>{
    stalledChecks=0;
    setPlayingState(true);
});
audio.addEventListener("waiting",()=>{
    if(playing) scheduleReconnect();
});
audio.addEventListener("stalled",()=>{
    if(playing) scheduleReconnect();
});
audio.addEventListener("error",()=>{
    if(playing) scheduleReconnect();
});
audio.addEventListener("ended",()=>{
    if(playing) scheduleReconnect();
});

/* Detección de stream congelado sin Web Audio/CORS */
setInterval(()=>{
    if(!playing) return;
    const current=audio.currentTime;
    if(Number.isFinite(current) && current===lastTime){
        stalledChecks++;
        if(stalledChecks>=2) scheduleReconnect();
    }else{
        stalledChecks=0;
    }
    lastTime=current;
},12000);

/* Onda visual: sigue el ritmo real del stream mediante Web Audio.
   crossOrigin se configura ANTES de asignar el src. Si el servidor no permite
   CORS, se conserva una animación de respaldo para no romper el reproductor. */
let audioContext=null;
let analyser=null;
let sourceNode=null;
let dataArray=null;
let analyserReady=false;
let fallbackPhase=0;

function initAudioAnalyser(){
    if(analyserReady) return true;

    try{
        audio.crossOrigin="anonymous";
        audioContext=new (window.AudioContext || window.webkitAudioContext)();
        analyser=audioContext.createAnalyser();
        analyser.fftSize=128;
        analyser.smoothingTimeConstant=.72;

        sourceNode=audioContext.createMediaElementSource(audio);
        sourceNode.connect(analyser);
        analyser.connect(audioContext.destination);

        dataArray=new Uint8Array(analyser.frequencyBinCount);
        analyserReady=true;
        return true;
    }catch(error){
        console.warn("Analizador de audio no disponible; usando onda de respaldo.",error);
        analyserReady=false;
        return false;
    }
}

function animateWave(){
    if(playing && analyserReady && analyser && dataArray){
        analyser.getByteFrequencyData(dataArray);

        for(let i=0;i<BARS_COUNT;i++){
            // Mapea las barras a frecuencias bajas/medias/altas.
            const ratio=i/(BARS_COUNT-1);
            const bin=Math.min(dataArray.length-1,Math.floor(ratio*(dataArray.length-1)));
            const nearby1=dataArray[Math.max(0,bin-1)] || 0;
            const nearby2=dataArray[bin] || 0;
            const nearby3=dataArray[Math.min(dataArray.length-1,bin+1)] || 0;
            const level=(nearby1*.2+nearby2*.6+nearby3*.2)/255;

            const center=1-Math.abs(i-(BARS_COUNT-1)/2)/((BARS_COUNT-1)/2);
            const height=Math.max(10,Math.min(100,10+level*90*(.62+.38*center)));
            barElements[i].style.height=height+"%";
        }
    }else{
        // Fallback visual cuando el navegador/servidor no permite analizar CORS.
        fallbackPhase+=playing?.13:.025;
        barElements.forEach((bar,index)=>{
            const center=1-Math.abs(index-(BARS_COUNT-1)/2)/((BARS_COUNT-1)/2);
            const movement=playing ? (Math.sin(fallbackPhase+index*.65)+1)/2 : 0;
            bar.style.height=Math.max(10,8+movement*78*center)+"%";
        });
    }

    requestAnimationFrame(animateWave);
}
animateWave();

/* Solo Instagram, WhatsApp y Compartir */
instagramBtn.addEventListener("click",()=>{
    window.open(INSTAGRAM_URL,"_blank","noopener,noreferrer");
});
whatsappBtn.addEventListener("click",()=>{
    window.open(WHATSAPP_URL,"_blank","noopener,noreferrer");
});

const shareBtn=document.getElementById("shareBtn");
shareBtn.addEventListener("click",async()=>{
    const shareData={
        title:"Fusión Stereo — En Vivo",
        text:"🎶 Escucha Fusión Stereo — Emisora Virtual. Señal desde Medellín, Colombia.",
        url:window.location.href
    };

    try{
        if(navigator.share){
            await navigator.share(shareData);
        }else if(navigator.clipboard){
            await navigator.clipboard.writeText(window.location.href);
            alert("Enlace de Fusión Stereo copiado. Ya puedes compartirlo.");
        }else{
            prompt("Copia este enlace para compartir Fusión Stereo:",window.location.href);
        }
    }catch(error){
        if(error.name!=="AbortError") console.error("Error al compartir:",error);
    }
});

/* PWA */
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",(event)=>{
    event.preventDefault();
    deferredPrompt=event;
    pwaBtn.hidden=false;
});
pwaBtn.addEventListener("click",async()=>{
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt=null;
    pwaBtn.hidden=true;
});
window.addEventListener("appinstalled",()=>{
    deferredPrompt=null;
    pwaBtn.hidden=true;
});

/* Service Worker */
if("serviceWorker" in navigator){
    window.addEventListener("load",()=>{
        navigator.serviceWorker.register("./service-worker.js")
            .catch(error=>console.error("Service Worker:",error));
    });
}
</script>
