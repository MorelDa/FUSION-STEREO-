<title>RADIO FUSIÓN STEREO - En Vivo</title><style>
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: #141631;
}

/* CONTENEDOR PRINCIPAL TOTALMENTE RESPONSIVE (100% PANTALLA PC Y MÓVIL) */
.app-container {
  position: relative;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* VIDEO DE FONDO INTEGRADO */


/* CAPA ROSA DE OVERLAY */


/* INTERFAZ VISUAL DEL REPRODUCTOR */
.ui-layer {
  position: relative;
  z-index: 3;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: calc(env(safe-area-inset-top) + 15px) 20px calc(env(safe-area-inset-bottom) + 20px) 20px;
}

/* CABECERA: LOGO Y BOTÓN */
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
}

.top-logo {
  width: 48px;
  height: 48px;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  border: 1.5px solid rgba(255, 255, 255, 0.4);
  overflow: hidden;
}

.top-logo img {
  width: 80%;
  height: 80%;
  object-fit: contain;
}

.pwa-action-btn {
  background: rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: #ffffff;
  border: 1px solid rgba(255, 255, 255, 0.3);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

/* SECCIÓN CENTRAL: PORTADA Y VINILO CENTRADOS */
.center-content {
  display: flex;
  justify-content: center;
  align-items: center;
  flex: 1;
  position: relative;
  width: 100%;
}

/* TAMAÑO REDUCIDO PARA MÓVIL Y AJUSTADO CON ASPECT-RATIO */
.album-art-wrapper {
  position: relative;
  width: 180px;
  height: 180px;
  aspect-ratio: 1 / 1;
}

/* VINILO GIRATORIO */
.vinyl-record {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  background: url('https://i.ibb.co/XZ9GtdfS/Proyecto-nuevo.webp') no-repeat center center / cover;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  border: 2px solid #000;
  display: flex;
  justify-content: center;
  align-items: center;
  will-change: transform;
}

.vinyl-center-label {
  width: 30%;
  height: 30%;
  border-radius: 50%;
  background: #ffffff;
  border: 2px solid #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
}

.vinyl-center-label img {
  width: 75%;
  height: 75%;
  object-fit: contain;
}

/* PORTADA DE ÁLBUM */
.album-cover {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 12px 35px rgba(0,0,0,0.6);
  border: 1px solid rgba(255, 255, 255, 0.2);
  z-index: 2;
  background: #1e1e22;
}

.album-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ANIMACIÓN AL REPRODUCIR */
.app-container.playing .vinyl-record {
  transform: translateX(75px);
  animation: spinVinyl 3s linear infinite;
}

@keyframes spinVinyl {
  from { transform: translateX(75px) rotate(0deg); }
  to { transform: translateX(75px) rotate(360deg); }
}

/* BARRAS DEL ECUALIZADOR (100% BORDE A BORDE SIN MÁRGENES LATERALES) */
.audio-wave-container {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 35%;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 2px;
  z-index: 2;
  pointer-events: none;
  padding: 0; /* Sin espacio a los costados */
}

.wave-bar {
  flex: 1;
  height: 10%;
  border-radius: 3px 3px 0 0;
  background: linear-gradient(to top, #ffffff, #ffffff);
  transition: height 0.05s ease;
}

/* SECCIÓN INFERIOR Y CONTROLES */
.bottom-controls {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
}

.black-player-bar {
  width: 100%;
  height: 65px;
  background: rgba(17, 17, 19, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 35px;
  display: flex;
  align-items: center;
  padding: 0 16px 0 10px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  box-shadow: 0 8px 25px rgba(0,0,0,0.5);
}

.station-avatar {
  width: 45px;
  height: 45px;
  background: #ffffff;
  border-radius: 50%;
  margin-right: 12px;
  overflow: hidden;
  flex-shrink: 0;
}

.station-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.track-text {
  flex: 1;
  overflow: hidden;
}

.track-text .title {
  font-weight: 700;
  font-size: 14px;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.track-text .subtitle {
  color: rgba(255, 255, 255, 0.7);
  font-size: 11px;
}

.spectators-tag {
  background: #ffffff;
  color: #000;
  font-size: 10px;
  font-weight: 800;
  padding: 5px 10px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  gap: 5px;
}

/* BOTONES DE ACCIÓN */
.action-controls {
  display: flex;
  width: 100%;
  justify-content: space-around;
  align-items: center;
}

.btn-action-play {
  width: 68px;
  height: 68px;
  background: #ffffff;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 26px;
  color: #0b0b0d;
  border: none;
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  cursor: pointer;
  transition: transform 0.2s ease;
}

.btn-action-play:active {
  transform: scale(0.92);
}

.btn-action-secondary {
  width: 50px;
  height: 50px;
  background: rgba(17, 17, 19, 0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 50%;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 18px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  cursor: pointer;
}

/* PANTALLAS GRANDES (PC Y TABLET) */
@media (min-width: 768px) {
  .album-art-wrapper {
    width: 280px;
    height: 280px;
  }

  .app-container.playing .vinyl-record {
    transform: translateX(110px);
  }

  @keyframes spinVinyl {
    from { transform: translateX(110px) rotate(0deg); }
    to { transform: translateX(110px) rotate(360deg); }
  }

  .black-player-bar {
    height: 75px;
  }

  .station-avatar {
    width: 52px;
    height: 52px;
  }

  .track-text .title {
    font-size: 16px;
  }

  .btn-action-play {
    width: 78px;
    height: 78px;
    font-size: 30px;
  }

  .btn-action-secondary {
    width: 58px;
    height: 58px;
    font-size: 20px;
  }
}

.app-container{
  background: radial-gradient(circle at 50% 30%, #1e1a4a 0%, #141631 55%, #0d0e22 100%);
}

<div class="app-container" id="mainContainer">
<!-- ECUALIZADOR DINÁMICO EN EL FONDO -->

        </div>

          <i class="fa-brands fa-whatsapp"></i>

        <button class="btn-action-secondary" onclick="window.open('https://www.instagram.com/emisorafusionstereo?igsi=MWFjaGtjM2czeWNrZg%3D%3D')">

<script>
const audioURL = "https://radios.voiparkas.com/listen/fusionstereo/radio.mp3";
const audio = new Audio(audioURL);
audio.crossOrigin = "anonymous"; 

let audioContext, analyser, dataArray;
let playing = false;

const playBtn = document.getElementById("playBtn");
const playIcon = document.getElementById("playIcon");
const mainContainer = document.getElementById("mainContainer");

// Crear barras para el ecualizador
const container = document.getElementById('wave-container');
const BARS_COUNT = 32; 
const barElements = [];

for (let i = 0; i < BARS_COUNT; i++) {
    const bar = document.createElement('div');
    bar.classList.add('wave-bar');
    container.appendChild(bar);
    barElements.push(bar);
}

function initAudioAnalyser() {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 64; 
    const bufferLength = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);
    
    const source = audioContext.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioContext.destination);
  }
}

playBtn.onclick = () => {
  initAudioAnalyser();
  if (audioContext.state === 'suspended') {
    audioContext.resume();
  }

  if (!playing) {
    audio.play();
    playIcon.className = "fa-solid fa-pause";
    mainContainer.classList.add("playing");
    playing = true;
  } else {
    audio.pause();
    playIcon.className = "fa-solid fa-play";
    mainContainer.classList.remove("playing");
    playing = false;
  }
};

// Animación dinámica de las barras
function animate() {
    if (playing && analyser) {
        analyser.getByteFrequencyData(dataArray);
        
        let totalVolume = 0;
        for(let i = 0; i < dataArray.length; i++) {
            totalVolume += dataArray[i];
        }
        let averageVolume = totalVolume / dataArray.length;

        barElements.forEach((bar, index) => {
            let rawValue = dataArray[index % dataArray.length] || 0;
            let mixedSignal = (rawValue * 0.4) + (averageVolume * 0.6);
            let dynamicFactor = Math.sin(index * 0.5 + Date.now() * 0.015) * 15;
            
            let finalHeight = ((mixedSignal / 255) * 85) + 10 + (dynamicFactor * (averageVolume / 255));

            if (finalHeight > 100) finalHeight = 100;
            if (finalHeight < 10) finalHeight = 10;

            bar.style.height = `${finalHeight}%`;
        });
    } else {
        barElements.forEach((bar) => {
            bar.style.height = `10%`;
        });
    }

    requestAnimationFrame(animate);
}

animate();
</script>

<script>
let deferredInstallPrompt = null;
const pwaBtn = document.getElementById("pwaBtn");

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
});

pwaBtn.addEventListener("click", async () => {
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
  } else {
    alert("Si no aparece la instalación automática, abre el menú del navegador y pulsa «Instalar aplicación» o «Añadir a pantalla de inicio».");
  }
});

async function compartirRadio() {
  const data = {
    title: "RADIO FUSIÓN STEREO",
    text: "Escucha Radio Fusión Stereo en vivo.",
    url: location.href
  };
  try {
    if (navigator.share) {
      await navigator.share(data);
    } else {
      await navigator.clipboard.writeText(location.href);
      alert("Enlace de Radio Fusión Stereo copiado.");
    }
  } catch(e) {}
}
document.getElementById("shareBtn")?.addEventListener("click", compartirRadio);
document.getElementById("shareBtnBottom")?.addEventListener("click", compartirRadio);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js"));
}
</script>
