<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fusión Stereo">

  <!-- Open Graph / redes sociales -->
  <meta property="og:title" content="Fusión Stereo — En Vivo">
  <meta property="og:description" content="Emisora virtual. Señal desde Medellín, Colombia. Escucha Fusión Stereo en vivo.">
  <meta property="og:image" content="https://i.ibb.co/XZ9GtdfS/Proyecto-nuevo.webp">
  <meta property="og:image:alt" content="Logo de Fusión Stereo">

  <meta property="og:site_name" content="Fusión Stereo">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Fusión Stereo — En Vivo">
  <meta name="twitter:description" content="Emisora virtual. Señal desde Medellín, Colombia.">
  <meta name="twitter:image" content="https://i.ibb.co/XZ9GtdfS/Proyecto-nuevo.webp">

  <link rel="icon" href="https://i.ibb.co/XZ9GtdfS/Proyecto-nuevo.webp" type="image/webp">
  <link rel="apple-touch-icon" href="https://i.ibb.co/XZ9GtdfS/Proyecto-nuevo.webp">
  <link rel="manifest" href="./manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root{
      --purple:#6500d1;
      --purple-dark:#26004f;
      --purple-deep:#10001f;
      --cyan:#22d3ee;
      --cyan-bright:#67e8f9;
      --white:#fff;
      --glass:rgba(13,8,25,.72);
      --glass-border:rgba(255,255,255,.16);
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--purple-deep);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:#fff;
    }

    button,a{font:inherit}
    button{border:0}
    a{text-decoration:none;color:inherit}

    .app-container{
      position:relative;
      width:100vw;
      height:100vh;
      height:100dvh;
      overflow:hidden;
      isolation:isolate;
      background:
        radial-gradient(circle at 50% 38%, rgba(101,0,209,.65), transparent 38%),
        radial-gradient(circle at 10% 90%, rgba(34,211,238,.18), transparent 30%),
        linear-gradient(145deg,#10001f 0%,#250044 46%,#08000f 100%);
    }

    /* Fondo decorativo */
    .bg-glow{
      position:absolute;
      inset:-25%;
      z-index:-3;
      background:
        radial-gradient(circle at 50% 35%, rgba(101,0,209,.32), transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(34,211,238,.10), transparent 24%),
        radial-gradient(circle at 15% 65%, rgba(255,90,0,.08), transparent 22%);
      filter:blur(50px);
      animation:ambient 9s ease-in-out infinite alternate;
    }

    @keyframes ambient{
      from{transform:scale(1) rotate(0deg)}
      to{transform:scale(1.08) rotate(3deg)}
    }

    .grid{
      position:absolute;
      inset:0;
      z-index:-2;
      opacity:.16;
      background-image:
        linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
      background-size:45px 45px;
      mask-image:linear-gradient(to bottom,transparent,black 20%,black 80%,transparent);
    }

    .overlay{
      position:absolute;
      inset:0;
      z-index:-1;
      background:linear-gradient(180deg,rgba(9,0,20,.12),rgba(8,0,14,.52) 58%,rgba(5,0,10,.92));
      backdrop-filter:blur(1px);
      -webkit-backdrop-filter:blur(1px);
    }

    .ui-layer{
      position:relative;
      z-index:5;
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      padding:
        calc(env(safe-area-inset-top) + 14px)
        clamp(14px,4vw,30px)
        calc(env(safe-area-inset-bottom) + 18px);
    }

    /* Cabecera */
    .header-bar{
      width:100%;
      max-width:1180px;
      margin:0 auto;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }

    .brand-mini{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .top-logo{
      width:52px;
      height:52px;
      flex:0 0 52px;
      border-radius:50%;
      overflow:hidden;
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.11);
      border:1px solid rgba(255,255,255,.25);
      box-shadow:0 8px 25px rgba(0,0,0,.35),0 0 28px rgba(101,0,209,.38);
      backdrop-filter:blur(10px);
    }

    .top-logo img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .brand-copy{
      min-width:0;
    }

    .brand-copy strong{
      display:block;
      font-size:14px;
      letter-spacing:.4px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .brand-copy span{
      display:block;
      margin-top:2px;
      color:rgba(255,255,255,.62);
      font-size:10px;
      white-space:nowrap;
    }

    .live-pill{
      display:flex;
      align-items:center;
      gap:7px;
      padding:9px 13px;
      border-radius:999px;
      color:#fff;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.18);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      font-size:10px;
      font-weight:800;
      letter-spacing:.7px;
      text-transform:uppercase;
      box-shadow:0 8px 24px rgba(0,0,0,.18);
    }

    .live-dot{
      width:7px;
      height:7px;
      border-radius:50%;
      background:#ff3b5c;
      box-shadow:0 0 0 0 rgba(255,59,92,.65);
      animation:pulse 1.7s infinite;
    }

    @keyframes pulse{
      70%{box-shadow:0 0 0 8px rgba(255,59,92,0)}
      100%{box-shadow:0 0 0 0 rgba(255,59,92,0)}
    }

    .install-btn{
      display:flex;
      align-items:center;
      gap:8px;
      padding:9px 13px;
      border-radius:999px;
      color:#fff;
      background:rgba(101,0,209,.5);
      border:1px solid rgba(255,255,255,.18);
      cursor:pointer;
    }


    /* PORTADA + VINILO — composición del HTML original */
    .album-art-wrapper{
      position:relative;
      width:180px;
      height:180px;
      aspect-ratio:1;
    }

    .vinyl-record{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border-radius:50%;
      background:
        radial-gradient(circle at center,rgba(255,255,255,.08) 0 9%,transparent 10%),
        repeating-radial-gradient(circle at center,#080808 0 2px,#171717 3px 5px);
      box-shadow:0 12px 35px rgba(0,0,0,.62);
      border:2px solid #080808;
      display:flex;
      justify-content:center;
      align-items:center;
      will-change:transform;
      transition:transform .8s cubic-bezier(.175,.885,.32,1.275);
      z-index:1;
    }

    .vinyl-record::before{
      content:"";
      position:absolute;
      inset:7%;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.08);
      box-shadow:inset 0 0 30px rgba(255,255,255,.08);
    }

    .vinyl-center-label{
      width:30%;
      height:30%;
      border-radius:50%;
      background:#fff;
      border:3px solid var(--cyan);
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      position:relative;
      z-index:2;
    }

    .vinyl-center-label img{
      width:76%;
      height:76%;
      object-fit:contain;
    }

    .album-cover{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 12px 35px rgba(0,0,0,.62);
      border:1px solid rgba(255,255,255,.22);
      z-index:2;
      background:#1e1e22;
      transition:transform .8s cubic-bezier(.175,.885,.32,1.275);
    }

    .album-cover img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .app-container.playing .vinyl-record{
      transform:translateX(75px);
      animation:spinVinyl 3s linear infinite;
    }

    .app-container.playing .album-cover{
      transform:translateX(0);
    }

    @keyframes spinVinyl{
      from{transform:translateX(75px) rotate(0deg)}
      to{transform:translateX(75px) rotate(360deg)}
    }

    /* Centro */
    .center-content{
      flex:1;
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      width:100%;
    }

    .station{
      width:min(78vw,360px);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:16px;
      transform:translateY(-1vh);
    }

    .logo-stage{
      position:relative;
      width:min(68vw,300px);
      aspect-ratio:1;
      display:grid;
      place-items:center;
    }

    .logo-halo{
      position:absolute;
      inset:7%;
      border-radius:50%;
      background:radial-gradient(circle,rgba(101,0,209,.55),rgba(101,0,209,.05) 58%,transparent 72%);
      filter:blur(10px);
      transform:scale(1.2);
    }

    .logo-ring{
      position:absolute;
      inset:2%;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.16);
      box-shadow:inset 0 0 30px rgba(101,0,209,.25),0 0 35px rgba(101,0,209,.2);
    }

    .logo-disc{
      position:relative;
      width:76%;
      aspect-ratio:1;
      border-radius:50%;
      overflow:hidden;
      border:2px solid rgba(255,255,255,.35);
      box-shadow:
        0 22px 55px rgba(0,0,0,.55),
        0 0 35px rgba(101,0,209,.4);
      background:#160027;
    }

    .logo-disc img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .logo-disc::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(145deg,rgba(255,255,255,.12),transparent 42%,rgba(0,0,0,.18));
      pointer-events:none;
    }

    .station-name{
      text-align:center;
    }

    .station-name h1{
      font-size:clamp(27px,7vw,42px);
      line-height:1;
      font-weight:900;
      letter-spacing:-1.2px;
      text-shadow:0 5px 24px rgba(0,0,0,.45);
    }

    .station-name p{
      margin-top:8px;
      color:rgba(255,255,255,.72);
      font-size:12px;
      letter-spacing:1.8px;
      text-transform:uppercase;
    }

    /* Wave */
    .audio-wave-container{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:31%;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:3px;
      padding:0;
      z-index:1;
      pointer-events:none;
      opacity:.92;
      mask-image:linear-gradient(to top,black 0%,black 60%,transparent 100%);
    }

    .wave-bar{
      flex:1;
      min-width:1px;
      height:8%;
      border-radius:4px 4px 0 0;
      background:#fff;
      box-shadow:0 0 10px rgba(255,255,255,.22);
      transition:height .08s linear;
    }

    /* Panel inferior */
    .bottom-controls{
      width:100%;
      max-width:520px;
      margin:0 auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:13px;
      position:relative;
      z-index:6;
    }

    .player-info{
      width:100%;
      min-height:70px;
      display:flex;
      align-items:center;
      gap:11px;
      padding:9px 12px 9px 9px;
      border-radius:22px;
      background:var(--glass);
      border:1px solid var(--glass-border);
      box-shadow:0 15px 35px rgba(0,0,0,.35);
      backdrop-filter:blur(15px);
      -webkit-backdrop-filter:blur(15px);
    }

    .station-avatar{
      width:52px;
      height:52px;
      flex:0 0 52px;
      border-radius:16px;
      overflow:hidden;
      background:#fff;
      box-shadow:0 5px 16px rgba(0,0,0,.3);
    }

    .station-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .track-text{
      flex:1;
      min-width:0;
    }

    .track-text .title{
      font-size:15px;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .track-text .subtitle{
      margin-top:4px;
      color:rgba(255,255,255,.62);
      font-size:11px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .signal-tag{
      flex-shrink:0;
      display:flex;
      align-items:center;
      gap:5px;
      padding:7px 9px;
      border-radius:12px;
      color:#fff;
      background:rgba(101,0,209,.5);
      border:1px solid rgba(255,255,255,.12);
      font-size:9px;
      font-weight:900;
      text-transform:uppercase;
    }

    .action-controls{
      width:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:clamp(20px,8vw,48px);
    }

    .social-btn,
    .play-btn{
      display:grid;
      place-items:center;
      border-radius:50%;
      cursor:pointer;
      color:#fff;
      transition:transform .16s ease,box-shadow .2s ease;
    }

    .social-btn{
      width:50px;
      height:50px;
      font-size:19px;
      background:rgba(12,7,22,.82);
      border:1px solid rgba(255,255,255,.16);
      box-shadow:0 8px 22px rgba(0,0,0,.32);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }

    .social-btn:hover{transform:translateY(-2px)}
    .social-btn:active,.play-btn:active{transform:scale(.92)}

    .play-btn{
      width:76px;
      height:76px;
      background:#fff;
      color:var(--cyan);
      font-size:28px;
      box-shadow:
        0 12px 32px rgba(0,0,0,.45),
        0 0 0 6px rgba(34,211,238,.08),
        0 0 35px rgba(34,211,238,.2);
    }

    .play-btn i{
      margin-left:3px;
      filter:drop-shadow(0 2px 4px rgba(0,0,0,.18));
    }

    .help-text{
      color:rgba(255,255,255,.42);
      font-size:9px;
      letter-spacing:.5px;
      text-align:center;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:calc(env(safe-area-inset-bottom) + 115px);
      transform:translate(-50%,15px);
      z-index:30;
      max-width:min(90vw,420px);
      padding:11px 15px;
      border-radius:14px;
      background:rgba(8,4,15,.92);
      border:1px solid rgba(255,255,255,.14);
      box-shadow:0 15px 35px rgba(0,0,0,.35);
      color:#fff;
      font-size:12px;
      text-align:center;
      opacity:0;
      pointer-events:none;
      transition:.25s ease;
      backdrop-filter:blur(12px);
    }

    .toast.show{
      opacity:1;
      transform:translate(-50%,0);
    }

    .loading{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      pointer-events:none;
      opacity:0;
      transition:opacity .2s;
    }

    .loading.show{opacity:1}

    .spinner{
      width:22px;
      height:22px;
      border:2px solid rgba(255,255,255,.22);
      border-top-color:var(--cyan);
      border-radius:50%;
      animation:spin .7s linear infinite;
    }

    @keyframes spin{to{transform:rotate(360deg)}}

    @media (min-width:768px){
      .ui-layer{
        padding-left:34px;
        padding-right:34px;
      }

      .top-logo{width:58px;height:58px;flex-basis:58px}
      .brand-copy strong{font-size:15px}
      .brand-copy span{font-size:11px}

      .album-art-wrapper{width:280px;height:280px}
      .app-container.playing .vinyl-record{transform:translateX(110px)}
      @keyframes spinVinyl{
        from{transform:translateX(110px) rotate(0deg)}
        to{transform:translateX(110px) rotate(360deg)}
      }
      .station-name h1{font-size:44px}

      .player-info{min-height:76px}
      .station-avatar{width:58px;height:58px;flex-basis:58px}
      .play-btn{width:84px;height:84px;font-size:30px}
      .social-btn{width:56px;height:56px}
    }

    @media (max-height:700px){
      .logo-stage{width:min(42vh,250px)}
      .station{gap:9px}
      .station-name h1{font-size:26px}
      .station-name p{margin-top:5px;font-size:9px}
      .player-info{min-height:58px}
      .station-avatar{width:42px;height:42px;flex-basis:42px;border-radius:12px}
      .play-btn{width:62px;height:62px;font-size:23px}
      .social-btn{width:44px;height:44px;font-size:17px}
      .action-controls{gap:28px}
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
      }
    }
  </style>
</head>

<body>
  <main class="app-container" id="mainContainer">
    <div class="bg-glow"></div>
    <div class="grid"></div>
    <div class="overlay"></div>

    <div class="audio-wave-container" id="wave-container" aria-hidden="true"></div>

    <section class="ui-layer">
      <header class="header-bar">
        <div class="brand-mini">
          <div class="top-logo">
            <img src="https://i.ibb.co/XZ9GtdfS/Proyecto-nuevo.webp" alt="Logo Fusión Stereo">
          </div>
          <div class="brand-copy">
            <strong>Fusión Stereo</strong>
            <span>Señal desde Medellín, Colombia</span>
          </div>
        </div>

        <div style="display:flex;align-items:center;gap:8px;">
          <div class="live-pill">
            <span class="live-dot"></span>
            EN VIVO
          </div>
          <button class="install-btn" id="installBtn" type="button" aria-label="Instalar Fusión Stereo" style="display:flex;">
            <i class="fa-solid fa-download"></i>
            <span>Instalar</span>
          </button>
        </div>
      </header>

      <div class="center-content">
        <div class="station">
          <div class="album-art-wrapper">
            <div class="vinyl-record" aria-hidden="true">
              <div class="vinyl-center-label">
                <img src="https://i.ibb.co/XZ9GtdfS/Proyecto-nuevo.webp" alt="">
              </div>
            </div>
            <div class="album-cover">
              <img src="https://i.ibb.co/XZ9GtdfS/Proyecto-nuevo.webp" alt="Fusión Stereo">
            </div>
          </div>

          <div class="station-name">
            <h1>Fusión Stereo</h1>
            <p>Emisora virtual · Medellín, Colombia</p>
          </div>
        </div>

        <div class="loading" id="loading">
          <div class="spinner"></div>
        </div>
      </div>

      <div class="bottom-controls">
        <div class="player-info">
          <div class="station-avatar">
            <img src="https://i.ibb.co/XZ9GtdfS/Proyecto-nuevo.webp" alt="Fusión Stereo">
          </div>

          <div class="track-text">
            <div class="title">Fusión Stereo</div>
            <div class="subtitle" id="statusText">Pulsa play para escuchar la señal en vivo</div>
          </div>

          <div class="signal-tag">
            <i class="fa-solid fa-signal"></i>
            LIVE
          </div>
        </div>

        <div class="action-controls">
          <button class="play-btn" id="playBtn" type="button" aria-label="Reproducir Fusión Stereo" aria-pressed="false">
            <i class="fa-solid fa-play" id="playIcon"></i>
          </button>

          <a class="social-btn" href="https://wa.me/573117679576" target="_blank" rel="noopener noreferrer"
             aria-label="WhatsApp Fusión Stereo" title="WhatsApp">
            <i class="fa-brands fa-whatsapp"></i>
          </a>

          <a class="social-btn" href="https://www.instagram.com/emisorafusionstereo?igsi=MWFjaGtjM2czeWNrZg=="
             target="_blank" rel="noopener noreferrer" aria-label="Instagram Fusión Stereo" title="Instagram">
            <i class="fa-brands fa-instagram"></i>
          </a>

          <button class="social-btn" id="shareBtn" type="button" aria-label="Compartir Fusión Stereo" title="Compartir">
            <i class="fa-solid fa-share-nodes"></i>
          </button>
        </div>

        <div class="help-text">Fusión Stereo · La música que nos une</div>Fusión Stereo · La música que nos une</div>
      </div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <script>
    (() => {
      "use strict";

      const STREAM_URL = "https://radios.voiparkas.com/listen/fusionstereo/radio.mp3";

      const audio = new Audio();
      audio.src = STREAM_URL;
      audio.preload = "none";
      audio.autoplay = false;\n      // IMPORTANTE: no iniciar audio automáticamente al entrar.
      audio.controls = false;

      const main = document.getElementById("mainContainer");
      const playBtn = document.getElementById("playBtn");
      const playIcon = document.getElementById("playIcon");
      const statusText = document.getElementById("statusText");
      const loading = document.getElementById("loading");
      const toast = document.getElementById("toast");
      const waveContainer = document.getElementById("wave-container");
      const installBtn = document.getElementById("installBtn");

      const BARS = 64;
      const bars = [];
      let playing = false;
      let animationFrame = null;
      let audioContext = null;
      let analyser = null;
      let analyserData = null;
      let analyserReady = false;
      let deferredInstallPrompt = null;
      let toastTimer = null;

      // Crear wave blanca
      for (let i = 0; i < BARS; i++) {
        const bar = document.createElement("div");
        bar.className = "wave-bar";
        waveContainer.appendChild(bar);
        bars.push(bar);
      }

      function showToast(message) {
        clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add("show");
        toastTimer = setTimeout(() => toast.classList.remove("show"), 3200);
      }

      function setPlayingState(value) {
        playing = value;
        main.classList.toggle("playing", value);
        playIcon.className = value ? "fa-solid fa-pause" : "fa-solid fa-play";
        playBtn.setAttribute("aria-pressed", String(value));
        playBtn.setAttribute("aria-label", value ? "Pausar Fusión Stereo" : "Reproducir Fusión Stereo");
        statusText.textContent = value
          ? "Escuchando señal en vivo · Medellín, Colombia"
          : "Pulsa play para escuchar la señal en vivo";
      }

      /*
       * El analizador se intenta activar solo si el navegador y el servidor
       * permiten analizar el stream. Si el servidor de radio no entrega CORS,
       * la radio sigue funcionando y el wave pasa automáticamente a una
       * animación visual de respaldo.
       */
      function tryInitAnalyser() {
        if (analyserReady || analyser) return;

        try {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 128;
          analyser.smoothingTimeConstant = 0.72;
          analyserData = new Uint8Array(analyser.frequencyBinCount);

          // No se fuerza crossOrigin: esto prioriza que el stream pueda reproducirse.
          const source = audioContext.createMediaElementSource(audio);
          source.connect(analyser);
          analyser.connect(audioContext.destination);

          analyserReady = true;
        } catch (error) {
          analyserReady = false;
          analyser = null;
          // Fallback visual; no bloquea la reproducción.
        }
      }

      function fallbackWave(time) {
        const active = playing ? 1 : 0;
        const volume = active ? 1 : .16;

        bars.forEach((bar, i) => {
          const x = i / BARS;
          const shape = Math.sin(time * .004 + i * .58) * 0.5 + 0.5;
          const shape2 = Math.sin(time * .007 - i * .31) * 0.5 + 0.5;
          const center = 1 - Math.min(1, Math.abs(x - .5) * 1.8);
          const h = (8 + (shape * .52 + shape2 * .28 + center * .2) * 78) * volume;
          bar.style.height = Math.max(5, Math.min(96, h)) + "%";
        });
      }

      function drawWave(time) {
        if (playing && analyserReady && analyser) {
          try {
            analyser.getByteFrequencyData(analyserData);

            bars.forEach((bar, i) => {
              const idx = Math.floor((i / BARS) * analyserData.length);
              const value = analyserData[idx] || 0;
              const h = 6 + (value / 255) * 88;
              bar.style.height = h + "%";
            });
          } catch (error) {
            analyserReady = false;
            fallbackWave(time);
          }
        } else {
          fallbackWave(time);
        }

        animationFrame = requestAnimationFrame(drawWave);
      }

      async function startAudio() {
        loading.classList.add("show");

        try {
          tryInitAnalyser();

          if (audioContext && audioContext.state === "suspended") {
            await audioContext.resume();
          }

          await audio.play();
          setPlayingState(true);
        } catch (error) {
          setPlayingState(false);

          let message = "No se pudo iniciar la señal. Intenta nuevamente.";
          if (error && error.name === "NotSupportedError") {
            message = "El navegador no admite este formato de transmisión.";
          } else if (error && error.name === "NotAllowedError") {
            message = "El navegador bloqueó la reproducción. Pulsa play nuevamente.";
          }

          statusText.textContent = "No fue posible conectar con la señal";
          showToast(message);
        } finally {
          loading.classList.remove("show");
        }
      }

      function stopAudio() {
        audio.pause();
        setPlayingState(false);
      }

      playBtn.addEventListener("click", () => {
        if (playing) stopAudio();
        else startAudio();
      });

      audio.addEventListener("waiting", () => {
        if (playing) {
          statusText.textContent = "Conectando con la señal en vivo…";
          loading.classList.add("show");
        }
      });

      audio.addEventListener("playing", () => {
        loading.classList.remove("show");
        if (playing) statusText.textContent = "Escuchando señal en vivo · Medellín, Colombia";
      });

      audio.addEventListener("stalled", () => {
        if (playing) showToast("La señal está tardando en responder…");
      });

      audio.addEventListener("error", () => {
        loading.classList.remove("show");
        setPlayingState(false);
        statusText.textContent = "Se perdió la conexión con la señal";
        showToast("No se pudo cargar la transmisión. Revisa la conexión de internet.");
      });

      audio.addEventListener("pause", () => {
        if (playing) setPlayingState(false);
      });


      const shareBtn = document.getElementById("shareBtn");

      shareBtn.addEventListener("click", async () => {
        const shareData = {
          title: "Fusión Stereo",
          text: "Escucha Fusión Stereo — emisora virtual con señal desde Medellín, Colombia.",
          url: window.location.href
        };

        try {
          if (navigator.share) {
            await navigator.share(shareData);
          } else if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(window.location.href);
            showToast("Enlace de Fusión Stereo copiado.");
          } else {
            showToast("Copia el enlace de esta página para compartir Fusión Stereo.");
          }
        } catch (error) {
          if (error && error.name !== "AbortError") {
            showToast("No fue posible abrir el menú de compartir.");
          }
        }
      });

      // PWA: el botón queda disponible en el encabezado.
      // El navegador mostrará su instalador cuando beforeinstallprompt esté disponible.
      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        deferredInstallPrompt = event;
        installBtn.style.display = "flex";
      });

      installBtn.addEventListener("click", async () => {
        if (!deferredInstallPrompt) {
        showToast("La instalación se ofrece desde el navegador cuando esta página cumple los requisitos de PWA.");
        return;
      }

        deferredInstallPrompt.prompt();
        const result = await deferredInstallPrompt.userChoice;

        if (result.outcome === "accepted") {
          showToast("Fusión Stereo se está instalando.");
        }

        deferredInstallPrompt = null;
        installBtn.style.display = "none";
      });

      window.addEventListener("appinstalled", () => {
        deferredInstallPrompt = null;
        installBtn.style.display = "none";
        showToast("Fusión Stereo quedó instalada.");
      });

      // Service worker
      if ("serviceWorker" in navigator && location.protocol !== "file:") {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }

      drawWave(performance.now());
    })();
  </script>
</body>
</html>
